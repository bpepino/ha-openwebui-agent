---
name: Bug report
description: Report an Open WebUI Agent problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "DO NOT POST API KEYS OR TOKENS. Remove private chat, memory and tool arguments from logs. Search existing issues first."
  - type: input
    attributes:
      label: Integration / Home Assistant / Open WebUI versions
    validations:
      required: true
  - type: input
    attributes:
      label: Model and provider/backend
    validations:
      required: true
  - type: textarea
    attributes:
      label: Feature flags, tool mode and terminal mode
      description: State whether Memory, Web Search, Code Interpreter and Image Generation are enabled. Omit private resource names if needed.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Does the same prompt and configuration work in the Open WebUI browser as the API-key user?
      options: ["Yes", "No", "Not tested"]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction and expected/actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized integration debug logs and diagnostics
      description: Remove keys, tokens, private prompts, memory and tool arguments. Include only relevant logs.
      render: text
